services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AFHE_API_URL: ${AFHE_API_URL:-https://api.afhe.io:8443}
      AFHE_API_KEY: ${AFHE_API_KEY:-}
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp

volumes:
  caddy_data:
